version: '3.8'

services:
  kindle-destaques:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kindle-destaques
    restart: unless-stopped
    
    environment:
      - PUID=1033
      - PGID=100
      - TZ=America/Sao_Paulo
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    
    ports:
      - "8501:8501"
    
    volumes:
      - /volume1/docker/kindle/data:/app/data
      - /volume1/docker/kindle/output:/app/output
      - /volume1/docker/kindle/logs:/app/logs
    
    networks:
      - default

networks:
  default:
    name: synobridge
    external: true